services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asistente}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asistente}
      POSTGRES_DB: ${POSTGRES_DB:-asistente}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

  rag-service:
    build: ./rag-service
    restart: unless-stopped
    depends_on:
      - postgres
      - ollama
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-asistente}:${POSTGRES_PASSWORD:-asistente}@postgres:5432/${POSTGRES_DB:-asistente}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      DRIVE_SITIO_WEB_FOLDER_ID: ${DRIVE_SITIO_WEB_FOLDER_ID:-}
      PORT: 3210
    ports:
      - "127.0.0.1:3210:3210"

  n8n:
    image: n8nio/n8n
    restart: unless-stopped
    depends_on:
      - rag-service
    environment:
      GENERIC_TIMEZONE: America/Argentina/Jujuy
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows:ro
    ports:
      - "127.0.0.1:5678:5678"

volumes:
  postgres_data:
  ollama_data:
  n8n_data:
